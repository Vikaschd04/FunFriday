name: Blueprint configuration validation
on:
  push:
    paths:
      - '**/*.md'
      - '.claude/**'
      - 'scripts/**'
      - 'examples/**'
      - 'infra/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:
jobs:
  validate-blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "PyYAML>=6.0"
      - run: python scripts/validate_pack.py
