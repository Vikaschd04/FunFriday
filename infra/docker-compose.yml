name: funfriday-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: funfriday_dev
      POSTGRES_PASSWORD: funfriday_local_only_change_me
      POSTGRES_DB: funfriday_dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U funfriday_dev -d funfriday_dev']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
