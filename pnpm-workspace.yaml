packages:
  - apps/*
  - packages/*

# pnpm 11 blocks dependency lifecycle scripts unless explicitly allowed.
# Each entry below is required: Prisma schema engine (migrations), native
# SWC/esbuild binaries (API tests, tsx seed runner), native ESLint resolver.
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  unrs-resolver: true

# pnpm 11 refuses packages younger than its minimum release age (supply-chain
# guard). Exclusions are allowed ONLY for verified security releases:
# next@16.4.1 (+ its platform binaries/eslint config) fixes critical RCE
# advisories GHSA-673q-mjm6-r5xr and GHSA-2464-fhr4-w9xw; react/react-dom
# 19.3.1 is the coordinated same-day patch. Remove entries once they age out.
minimumReleaseAgeExclude:
  - '@next/env@16.4.1'
  - '@next/eslint-plugin-next@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'
  - eslint-config-next@16.4.1
  - next@16.4.1
  - react-dom@19.3.1
  - react@19.3.1
  - '@better-auth/core@1.7.8'
  - '@better-auth/drizzle-adapter@1.7.8'
  - '@better-auth/kysely-adapter@1.7.8'
  - '@better-auth/memory-adapter@1.7.8'
  - '@better-auth/mongo-adapter@1.7.8'
  - '@better-auth/prisma-adapter@1.7.8'
  - '@better-auth/telemetry@1.7.8'
  - better-auth@1.7.8

# Security overrides (pnpm audit, 2026-10-15). Both packages are pulled in only
# by Prisma's CLI/config loader (dev + migration tooling, not request handling).
#  - mysql2 <3.23.1: GHSA-3f6p-5ww8-9rcr (high), GHSA-rgwj-5xj2-c3m3 (moderate)
#  - deepmerge-ts <8: GHSA-ggr8-5vv4-36mx (high); 8.x keeps ESM+CJS exports.
# Verified with prisma generate/migrate/seed + API integration tests. Drop once
# Prisma ships patched dependencies.
overrides:
  mysql2: 3.24.5
  deepmerge-ts: 8.0.2

auditConfig:
  # braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm): NO patched release exists on npm
  # (latest is 3.0.3). Reachable only via eslint-config-next's glob matcher at
  # lint time on our own source tree - no untrusted input.
  # Owner: lead engineer. Accepted 2026-10-15; next review 2026-11-15.
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
